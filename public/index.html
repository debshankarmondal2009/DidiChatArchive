  <h1>Chat Archive</h1>
  <p>An offline, read-only Android app (Kotlin + Jetpack Compose) for viewing an exported chat conversation.</p>
  <h2>Build the APK</h2>
  <ol>
    <li>Open the project in Android Studio (JDK 17), or run <code>./gradlew assembleDebug</code>.</li>
    <li>The APK is written to <code>app/build/outputs/apk/debug/app-debug.apk</code>.</li>
  </ol>
